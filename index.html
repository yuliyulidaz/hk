<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="홍콩">
<meta name="mobile-web-app-capable" content="yes">
<title>홍콩 3박 4일</title>
<style>
/* Layout: one scrolling column, no fixed header. Hierarchy by size, weight and whitespace only.
   The only fixed element is a translucent bottom tab bar. */
:root{
  --bg:#fcfbfa;
  --fg:#1c1917;
  --muted:#8b817b;
  --faint:#b9b0aa;
  --hair:#ebe5e1;
  --accent:#c2493e;
  --accent-soft:#f6e3e0;
  --bar:rgba(252,251,250,.78);
  --water:#edf1f3;
  --l-twl:#d9332b;
  --l-isl:#1f79c7;
  --l-ae:#1a9a95;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141212; --fg:#ece7e3; --muted:#8f8580; --faint:#5f5752; --hair:#272322;
    --accent:#e2786d; --accent-soft:#3a211e; --bar:rgba(20,18,18,.72); --water:#1b2024;
    --l-twl:#ef5a52; --l-isl:#4f9be0; --l-ae:#39b5af; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141212; --fg:#ece7e3; --muted:#8f8580; --faint:#5f5752; --hair:#272322;
  --accent:#e2786d; --accent-soft:#3a211e; --bar:rgba(20,18,18,.72); --water:#1b2024;
  --l-twl:#ef5a52; --l-isl:#4f9be0; --l-ae:#39b5af; color-scheme:dark;
}

html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
main{
  max-width:560px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px calc(104px + env(safe-area-inset-bottom,0px));
}
.view[hidden]{display:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,.item:focus-within{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}

/* type scale */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.2}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px}
.small{font-size:13px;color:var(--muted)}
.empty{color:var(--faint);font-size:14px;margin:0}

header.page{margin-bottom:34px}
.chips{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:18px;font-size:14px;font-variant-numeric:tabular-nums}
.chips button{color:var(--accent);font-weight:500}

/* schedule — one day per page: switcher, map (1/3 screen), stops */
#view-schedule{margin-top:-8px}
.mapwrap{
  position:relative;height:33vh;height:33dvh;min-height:180px;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:var(--water);overflow:hidden;
}
#gmap{position:absolute;inset:0}
.gpin{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 11px/22px var(--font);text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s,opacity .2s,background .2s}
.gpin.dim{opacity:.35}
.gpin.focus{transform:scale(1.35)}
.mapwrap .open{
  position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:12px;
  font-size:12px;letter-spacing:.02em;color:var(--accent);background:var(--bg);
  padding:5px 10px;border-radius:999px;opacity:.95;
}
.mapwrap .open:hover{text-decoration:none}
.mapwrap .nomap{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:14px}
.daybody{padding-top:26px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.dayhead .date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.timeline{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.stop{padding-block:4px}
.leg{display:grid;grid-template-columns:52px 1fr;gap:0 14px}
.leg .body{position:relative;padding:10px 0 10px 26px;min-height:40px}
.leg .body::before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:2px dotted var(--faint);transition:border-color .2s}
.leg.active .body::before{border-left-color:var(--accent)}
.leg button{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-align:left;padding:2px 0}
.leg button .dur{color:var(--faint);font-weight:400}
.leg button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.leg.active button{color:var(--accent);font-weight:600}
.leg .detail{display:none;font-size:14px;color:var(--fg);margin:8px 0 4px;line-height:1.5}
.leg.active .detail{display:block}
.leg .detail .dur{color:var(--muted);font-size:13px;margin-left:8px}
.stop .num{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:11px;font-weight:700;line-height:18px;text-align:center;margin-right:8px;vertical-align:2px;font-variant-numeric:tabular-nums}
.stop.move .num{background:var(--faint)}
.stop{display:grid;grid-template-columns:52px 1fr;gap:0 14px;align-items:baseline}
.stop .time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stop .place{font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:0}
.stop .note{grid-column:2;color:var(--muted);font-size:14px;margin-top:2px;min-width:0}
.stop .pin{display:inline-flex;align-items:center;vertical-align:-2px;margin-left:8px;color:var(--faint);padding:2px}
.stop .pin svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stop .pin[aria-pressed="true"]{color:var(--accent)}
.stop.move .place{font-weight:400;color:var(--muted)}

/* weather */
.refresh{margin-left:12px;color:var(--accent);font-size:13px;font-weight:500}
.refresh.busy{opacity:.5;pointer-events:none}
.now{display:flex;align-items:flex-end;gap:18px;margin-bottom:8px}
.now .temp{font-size:72px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.now .cond{font-size:18px;font-weight:600;line-height:1.3;padding-bottom:8px}
.now .cond small{display:block;font-size:14px;color:var(--muted);font-weight:400;margin-top:4px}
.sun{display:flex;gap:22px;color:var(--muted);font-size:14px;margin:18px 0 0;font-variant-numeric:tabular-nums}
.sun b{color:var(--fg);font-weight:600;margin-left:6px}
.days-wx{list-style:none;margin:30px 0 0;padding:0;border-top:1px solid var(--hair)}
.days-wx li{display:grid;grid-template-columns:76px 1fr auto;gap:2px 14px;align-items:baseline;padding-block:12px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
.days-wx .d{font-size:14px}
.days-wx .d .tag{display:block;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.days-wx .c{font-size:15px;min-width:0}
.days-wx .c small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.days-wx .t{font-size:15px;white-space:nowrap}
.days-wx .t span{color:var(--muted);margin-left:6px}
.days-wx li.trip .d{font-weight:600}

/* 노선도 viewer */
.viewer{position:relative;height:70vh;height:70dvh;min-height:320px;overflow:hidden;background:var(--water);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  touch-action:none;user-select:none;-webkit-user-select:none}
.viewer img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;will-change:transform;-webkit-user-drag:none}
.viewer-ctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:12px;display:flex;gap:4px;
  background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--hair);border-radius:999px;padding:3px}
.viewer-ctl button{min-width:36px;height:32px;padding:0 10px;border-radius:999px;font-size:15px;color:var(--fg)}
.viewer-ctl button:active{background:var(--accent-soft)}
#mtrmsg{margin:14px 0 0}
#mtrmsg code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--fg)}

/* info */
.sec{padding-block:30px;border-top:1px solid var(--hair)}
.sec:first-of-type{border-top:0;padding-top:0}
.map{width:100%;height:auto;display:block;overflow:visible}
.map text{font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px;background:var(--c)}
.legend .ferry::before{background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 6px)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:10px 14px;margin:0;font-size:15px}
.kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* bottom menu — floating translucent pill, the only fixed element */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  display:flex;justify-content:center;align-items:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
}
nav.tabs ul,nav.tabs .back{
  pointer-events:auto;
  background:var(--bar);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--hair);border-radius:999px;
  box-shadow:0 6px 24px rgba(0,0,0,.08);
}
nav.tabs ul{display:flex;align-items:center;gap:2px;margin:0;padding:5px;list-style:none;max-width:100%}
nav.tabs ul button{
  display:block;padding:9px 18px;border-radius:999px;
  font-size:14px;color:var(--muted);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;
  transition:color .2s,background .2s;
}
nav.tabs ul button .dot{display:none}
nav.tabs ul button[aria-current="page"]{color:var(--fg);font-weight:600;background:var(--accent-soft)}
nav.tabs ul.days button{padding:9px 14px}
nav.tabs .back{
  width:44px;height:44px;display:grid;place-items:center;color:var(--muted);padding:0;flex:none;
}
nav.tabs .back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
nav.tabs button:active{transform:scale(.97)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<main>
  <!-- 일정 -->
  <section class="view" id="view-schedule">
    <div class="mapwrap" id="map">
      <div id="gmap"></div>
      <div class="nomap" id="mapmsg" hidden></div>
      <a class="open" id="mapopen" href="#" target="_blank" rel="noopener" hidden>Google 지도에서 열기 ↗</a>
    </div>
    <div class="daybody" id="daybody"></div>
  </section>

  <!-- 날씨 -->
  <section class="view" id="view-weather" hidden>
    <header class="page">
      <p class="eyebrow">Weather</p>
      <h1>홍콩 날씨</h1>
      <p class="sub"><span id="wx-updated"></span><button type="button" class="refresh" id="wx-refresh">새로고침</button></p>
    </header>
    <div id="wx"></div>
  </section>

  <!-- 노선도 -->
  <section class="view" id="view-info" hidden>
    <header class="page">
      <p class="eyebrow">MTR</p>
      <h1>노선도</h1>
      <p class="sub">두 손가락으로 확대, 드래그로 이동</p>
    </header>

    <div class="viewer" id="mtrview">
      <img id="mtrimg" alt="MTR 전체 노선도" draggable="false">
      <div class="viewer-ctl"><button type="button" data-z="-">−</button><button type="button" data-z="+">+</button><button type="button" data-z="0">맞춤</button></div>
    </div>
    <p class="empty" id="mtrmsg" hidden>저장소에 <code>mtr-map.jpg</code> 파일을 올리면 여기에 전체 노선도가 뜹니다. 그때까지는 아래 간략 노선도로.</p>

    <section class="sec" id="mtrsimple">
      <h3>주요 구간</h3>
      <svg class="map" viewBox="0 0 360 300" role="img" aria-label="홍콩 MTR 간략 노선도: 공항철도, 췬완선, 아일랜드선, 스타페리">
        <!-- harbour -->
        <rect x="0" y="176" width="360" height="30" rx="4" fill="var(--water)"/>
        <text x="352" y="195" text-anchor="end" font-size="9.5" fill="var(--faint)" letter-spacing=".08">빅토리아 하버</text>

        <!-- Airport Express (teal) -->
        <polyline points="28,58 82,58 120,96 120,224" fill="none" stroke="var(--l-ae)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Tsuen Wan Line (red): Mong Kok → TST → Admiralty → Central -->
        <polyline points="200,36 200,230 128,230" fill="none" stroke="var(--l-twl)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Island Line (blue) -->
        <line x1="50" y1="244" x2="330" y2="244" stroke="var(--l-isl)" stroke-width="4" stroke-linecap="round"/>
        <!-- Star Ferry (dashed) TST ↔ Central -->
        <path d="M190,166 C170,190 150,206 132,220" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round"/>

        <!-- AE stations -->
        <g fill="var(--bg)" stroke="var(--l-ae)" stroke-width="2.4">
          <circle cx="28" cy="58" r="4.5"/><circle cx="82" cy="58" r="4.5"/><circle cx="120" cy="150" r="4.5"/>
        </g>
        <!-- TWL stations (Kowloon side) -->
        <g fill="var(--bg)" stroke="var(--l-twl)" stroke-width="2.4">
          <circle cx="200" cy="50" r="4.5"/><circle cx="200" cy="88" r="4.5"/><circle cx="200" cy="126" r="4.5"/><circle cx="200" cy="162" r="4.5"/>
        </g>
        <!-- Island stations -->
        <g fill="var(--bg)" stroke="var(--l-isl)" stroke-width="2.4">
          <circle cx="60" cy="244" r="4.5"/><circle cx="262" cy="244" r="4.5"/><circle cx="322" cy="244" r="4.5"/>
        </g>
        <!-- Interchanges: Central (AE+TWL+ISL), Admiralty (TWL+ISL) -->
        <g fill="var(--bg)" stroke="var(--fg)" stroke-width="2.2">
          <rect x="114" y="222" width="12" height="29" rx="6"/>
          <rect x="194" y="222" width="12" height="29" rx="6"/>
        </g>

        <!-- labels -->
        <g font-size="10.5" fill="var(--fg)">
          <text x="28" y="44" text-anchor="middle">공항</text>
          <text x="82" y="44" text-anchor="middle">칭이</text>
          <text x="110" y="153" text-anchor="end">카우룽</text>
          <text x="190" y="53" text-anchor="end">몽콕</text>
          <text x="190" y="91" text-anchor="end">야우마테이</text>
          <text x="190" y="129" text-anchor="end">조던</text>
          <text x="190" y="165" text-anchor="end" font-weight="600">침사추이</text>
          <text x="60" y="266" text-anchor="middle">셩완</text>
          <text x="120" y="266" text-anchor="middle" font-weight="600">센트럴</text>
          <text x="200" y="266" text-anchor="middle">애드미럴티</text>
          <text x="262" y="266" text-anchor="middle">완차이</text>
          <text x="322" y="266" text-anchor="middle">코즈웨이베이</text>
        </g>
        <g font-size="8" fill="var(--muted)" letter-spacing=".04">
          <text x="120" y="282" text-anchor="middle">Central · Hong Kong</text>
          <text x="200" y="282" text-anchor="middle">Admiralty</text>
          <text x="210" y="165">Tsim Sha Tsui</text>
          <text x="148" y="212" text-anchor="middle" transform="rotate(-38 148 212)">스타페리</text>
        </g>
      </svg>
      <div class="legend">
        <span style="--c:var(--l-ae)">공항철도</span>
        <span style="--c:var(--l-twl)">췬완선</span>
        <span style="--c:var(--l-isl)">아일랜드선</span>
        <span class="ferry">스타페리</span>
      </div>
      <p class="small" style="margin-top:12px">전체 노선은 <a href="https://www.mtr.com.hk/" target="_blank" rel="noopener">MTR 공식 사이트</a>에서.</p>
    </section>

  </section>
</main>

<nav class="tabs" aria-label="메뉴" id="tabnav"><ul id="tabbar"></ul></nav>

<script>
/* ───────────── 내용 (여기만 고치면 됨) ───────────── */
const TRIP = {
  // 날짜가 되면 그날 Day 페이지가 먼저 뜸 (여행 전엔 Day 1, 후엔 Day 4)
  // 지도: Google Maps JavaScript API + Routes API — 그날 lat/lng가 있는 장소를 핀으로, 사이를 경로선으로
  mapsKey: "AIzaSyCcL_bS9msj_EdP-x2xk6QX7mw8iCSnqvo",
  mapMode: "DRIVE",          // 하루 전체 경로선 기준: DRIVE / WALK / BICYCLE (대중교통은 구간 단위에서만 가능)
  days: [
    { label: "Day 1", date: "2026-11-17", items: [
      { time: "14:20", place: "홍콩 국제공항 도착", lat: 22.3080, lng: 113.9185 },
      { time: "16:30", place: "숙소 체크인", note: "침사추이", lat: 22.2946, lng: 114.1717,
        via: { type: "bus", label: "A21 버스", detail: "터미널 밖 버스 정류장에서 A21 탑승, 네이선 로드에서 하차. 옥토퍼스 가능", dur: "약 60분" } },
      { time: "18:30", place: "저녁", note: "침사추이 근처", lat: 22.2988, lng: 114.1722,
        via: { type: "walk", label: "도보", dur: "10분" } },
      { time: "20:00", place: "심포니 오브 라이츠", note: "침사추이 해변 산책로", lat: 22.2936, lng: 114.1735,
        via: { type: "walk", label: "도보", dur: "10분" } },
    ]},
    { label: "Day 2", date: "2026-11-18", items: [
      { time: "09:30", place: "숙소 출발", lat: 22.2946, lng: 114.1717 },
      { time: "10:00", place: "센트럴 페리 선착장", lat: 22.2855, lng: 114.1613,
        via: { type: "ferry", label: "스타페리", detail: "침사추이 선착장에서 센트럴행. 2층이 전망 좋음", dur: "약 10분" } },
      { time: "10:30", place: "미드레벨 에스컬레이터 · 소호", lat: 22.2834, lng: 114.1534,
        via: { type: "walk", label: "도보", dur: "15분" } },

/* ────────────────────────────────────────────── */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d);
  return `${m}.${String(d).padStart(2, "0")} ${WD[dt.getDay()]}`;
}
function todayIndex() {
  const n = new Date(); const t = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  const ts = TRIP.days.map(d => { const [y, m, dd] = d.date.split("-").map(Number); return new Date(y, m - 1, dd).getTime(); });
  const i = ts.indexOf(t); if (i >= 0) return i;
  if (t < ts[0]) return 0; if (t > ts[ts.length - 1]) return ts.length - 1;
  return 0;
}
const gmapsPoint = s => `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
function gmapsRoute(stops) {
  const p = stops.filter(s => s.lat != null);
  if (p.length < 2) return p.length ? gmapsPoint(p[0]) : null;
  const o = p[0], d = p[p.length - 1], w = p.slice(1, -1).map(s => `${s.lat},${s.lng}`).join("|");
  return `https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}` +
    (w ? `&waypoints=${encodeURIComponent(w)}` : "") + `&travelmode=transit`;
}

/* 일정 */
let currentDay = todayIndex();
let activeLeg = null;   // 펼쳐진 이동 구간의 도착 장소 index
let activePlace = null; // 핀을 눌러 지도 가운데로 둔 장소 index

const ICONS = {
  bus:   '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v2M16 18v2M8 14.5h.01M16 14.5h.01"/></svg>',
  mtr:   '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M9 14h.01M15 14h.01M8 17l-2 4M16 17l2 4"/></svg>',
  tram:  '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="13" rx="3"/><path d="M5 12h14M9 15h.01M15 15h.01M12 5V2M9 18l-1 3M15 18l1 3"/></svg>',
  ferry: '<svg viewBox="0 0 24 24"><path d="M4 17l1.5-6h13L20 17M8 11V7h8v4M12 7V4M3 20c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5"/></svg>',
  walk:  '<svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="1.6"/><path d="M10 21l2-6M12 15l3 2 1 4M8 12l2-4 3-1 2 3 3 1M10 8l-2 6"/></svg>',
  taxi:  '<svg viewBox="0 0 24 24"><path d="M5 17h14M4 17v-5l2-5h12l2 5v5M6 11h12M7 17v2M17 17v2M9 7V5h6v2"/></svg>',
  pin:   '<svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>',
  plane: '<svg viewBox="0 0 24 24"><path d="M3 13l8 2 3 6 2-1-1-7 5-3c1-.6 1-2-.5-2L15 9 9 3 7 4l3 6-6 1z"/></svg>',
};
const LEG_MODE = { walk: "WALK", taxi: "DRIVE" };

function legBounds(day, idx) {   // idx = 도착 장소 index → [출발, 도착]
  let j = idx - 1; while (j >= 0 && day.items[j].lat == null) j--;
  const to = day.items[idx];
  return (j >= 0 && to.lat != null) ? [day.items[j], to] : null;
}

/* ── Google 지도 (JavaScript API) ── */
let gmap = null, gMarkers = [], gLines = [];
const routeCache = new Map();
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function loadMaps() {
  if (!TRIP.mapsKey) { showMapMsg("지도 키를 넣으면 여기에 표시돼요"); return; }
  window.__initMap = () => {
    gmap = new google.maps.Map($("#gmap"), {
      center: { lat: 22.30, lng: 114.17 }, zoom: 12, mapId: "DEMO_MAP_ID",
      disableDefaultUI: true, clickableIcons: false, gestureHandling: "greedy",
      colorScheme: google.maps.ColorScheme.FOLLOW_SYSTEM,
    });
    updateMap();
  };
  const sc = document.createElement("script");
  sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(TRIP.mapsKey)}&v=weekly&loading=async&libraries=marker,geometry&language=ko&region=HK&callback=__initMap`;
  sc.onerror = () => showMapMsg("지도를 불러오지 못했어요");
  document.head.appendChild(sc);
}
function showMapMsg(t) { const m = $("#mapmsg"); m.textContent = t; m.hidden = !t; }

async function fetchRoute(pts, mode) {
  const key = mode + ":" + pts.map(p => `${p.lat},${p.lng}`).join("|");
  if (routeCache.has(key)) return routeCache.get(key);
  const loc = p => ({ location: { latLng: { latitude: p.lat, longitude: p.lng } } });
  const body = { origin: loc(pts[0]), destination: loc(pts[pts.length - 1]), travelMode: mode };
  if (pts.length > 2) body.intermediates = pts.slice(1, -1).map(loc);
  let path = null;
  try {
    const r = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Goog-Api-Key": TRIP.mapsKey, "X-Goog-FieldMask": "routes.polyline.encodedPolyline" },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    const enc = j.routes?.[0]?.polyline?.encodedPolyline;
    if (enc) path = google.maps.geometry.encoding.decodePath(enc);
  } catch (e) {}
  if (!path) path = pts.map(p => ({ lat: p.lat, lng: p.lng }));   // 경로를 못 받으면 직선으로
  routeCache.set(key, path);
  return path;
}

let mapToken = 0;
async function updateMap() {
  if (!gmap) return;
  const my = ++mapToken;
  const day = TRIP.days[currentDay];
  const pts = day.items.filter(s => s.lat != null);
  gMarkers.forEach(m => m.map = null); gMarkers = [];
  gLines.forEach(l => l.setMap(null)); gLines = [];
  const openEl = $("#mapopen");
  if (!pts.length) { showMapMsg("지도에 표시할 장소가 없어요"); openEl.hidden = true; return; }
  showMapMsg("");

  const leg = activeLeg != null ? legBounds(day, activeLeg) : null;
  const focusIdx = activePlace != null && day.items[activePlace]?.lat != null ? activePlace : null;
  const inLeg = leg ? new Set(leg) : null;

  // 핀
  day.items.forEach((it, n) => {
    if (it.lat == null) return;
    const el = document.createElement("div"); el.className = "gpin"; el.textContent = n + 1;
    if (inLeg && !inLeg.has(it)) el.classList.add("dim");
    if (focusIdx != null && focusIdx !== n) el.classList.add("dim");
    if (focusIdx === n) el.classList.add("focus");
    gMarkers.push(new google.maps.marker.AdvancedMarkerElement({ map: gmap, position: { lat: it.lat, lng: it.lng }, content: el, zIndex: focusIdx === n ? 10 : 1 }));
  });

  // 화면 맞추기 + 외부 링크
  const ll = s => `${s.lat},${s.lng}`;
  if (focusIdx != null) {
    gmap.panTo({ lat: day.items[focusIdx].lat, lng: day.items[focusIdx].lng }); gmap.setZoom(16);
    openEl.href = gmapsPoint(day.items[focusIdx]); openEl.hidden = false;
  } else {
    const fit = leg || pts;
    const b = new google.maps.LatLngBounds(); fit.forEach(p => b.extend({ lat: p.lat, lng: p.lng }));
    if (fit.length === 1) { gmap.setCenter(b.getCenter()); gmap.setZoom(15); }
    else gmap.fitBounds(b, { top: 36, right: 36, bottom: 48, left: 36 });
    const o = fit[0], d = fit[fit.length - 1], w = fit.slice(1, -1).map(ll).join("|");
    openEl.href = fit.length === 1 ? gmapsPoint(o)
      : `https://www.google.com/maps/dir/?api=1&origin=${ll(o)}&destination=${ll(d)}${w ? `&waypoints=${encodeURIComponent(w)}` : ""}&travelmode=transit`;
    openEl.hidden = false;
  }

  // 경로선
  const accent = cssVar("--accent"), muted = cssVar("--faint");
  if (leg) {
    const via = day.items[activeLeg].via || {};
    const mode = via.mode || LEG_MODE[via.type] || "TRANSIT";
    const path = await fetchRoute(leg, mode);
    if (my !== mapToken) return;
    gLines.push(new google.maps.Polyline({ map: gmap, path, strokeColor: accent, strokeOpacity: .95, strokeWeight: 4 }));
  } else if (pts.length > 1 && focusIdx == null) {
    const path = await fetchRoute(pts, day.mapMode || TRIP.mapMode || "DRIVE");
    if (my !== mapToken) return;
    gLines.push(new google.maps.Polyline({ map: gmap, path, strokeColor: muted, strokeOpacity: .9, strokeWeight: 3 }));
  }
}

function renderDay(i) {
  if (i !== currentDay) { activeLeg = null; activePlace = null; }
  currentDay = i; const d = TRIP.days[i];
  const rows = [];
  d.items.forEach((it, n) => {
    if (n > 0 && it.via) {
      const v = it.via, on = activeLeg === n;
      rows.push(`<li class="leg${on ? " active" : ""}" data-leg="${n}"><span></span><div class="body">
        <button type="button" aria-expanded="${on}">${ICONS[v.type] || ICONS.walk}<span>${esc(v.label || "")}</span>${!on && v.dur ? `<span class="dur">${esc(v.dur)}</span>` : ""}</button>
        <div class="detail">${esc(v.detail || v.label || "")}${v.dur ? `<span class="dur">${esc(v.dur)}</span>` : ""}</div>
      </div></li>`);
    }
    rows.push(`<li class="stop">
      <span class="time">${esc(it.time || "")}</span>
      <span class="place"><span class="num">${n + 1}</span>${esc(it.place || "")}${it.lat != null ? `<button type="button" class="pin" data-place="${n}" aria-pressed="${activePlace === n}" aria-label="지도에서 보기">${ICONS.pin}</button>` : ""}</span>
      ${it.note ? `<span class="note">${esc(it.note)}</span>` : ""}
    </li>`);
  });
  $("#daybody").innerHTML = `<div class="dayhead"><h2>${esc(d.label)}</h2><span class="date">${fmtDate(d.date)}</span></div>` +
    (rows.length ? `<ol class="timeline">${rows.join("")}</ol>` : `<p class="empty">아직 비어 있어요.</p>`);
  renderTabbar();
  updateMap();
}
$("#daybody").addEventListener("click", e => {
  const pin = e.target.closest(".pin");
  if (pin) {
    const n = Number(pin.dataset.place);
    activePlace = activePlace === n ? null : n; activeLeg = null;
    renderDay(currentDay); return;
  }
  const li = e.target.closest(".leg"); if (!li) return;
  const n = Number(li.dataset.leg);
  activeLeg = activeLeg === n ? null : n; activePlace = null;
  renderDay(currentDay);
});

/* 날씨 (Open-Meteo, 키 불필요) — 저장해 두고 새로고침 버튼으로만 갱신 */
const WX_KEY = "hk-weather-v1";
const WX_URL = "https://api.open-meteo.com/v1/forecast?latitude=22.3&longitude=114.17"
  + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation"
  + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset"
  + "&timezone=Asia%2FHong_Kong&forecast_days=16";
const WMO = { 0:"맑음",1:"대체로 맑음",2:"구름 조금",3:"흐림",45:"안개",48:"안개",51:"이슬비",53:"이슬비",55:"이슬비",
  56:"어는 이슬비",57:"어는 이슬비",61:"약한 비",63:"비",65:"강한 비",66:"어는 비",67:"어는 비",71:"눈",73:"눈",75:"눈",77:"눈",
  80:"소나기",81:"소나기",82:"강한 소나기",85:"눈",86:"눈",95:"뇌우",96:"뇌우·우박",99:"뇌우·우박" };
const hm = iso => iso.slice(11, 16);
const dayLabelFor = iso => { const d = TRIP.days.findIndex(x => x.date === iso); return d >= 0 ? TRIP.days[d].label : ""; };

function loadWx() { try { return JSON.parse(localStorage.getItem(WX_KEY) || "null"); } catch (e) { return null; } }
function renderWx(saved) {
  const upd = $("#wx-updated"), box = $("#wx");
  if (!saved) { upd.textContent = "아직 불러오지 않았어요"; box.innerHTML = ""; return; }
  const { t, data: w } = saved; const c = w.current, d = w.daily;
  const at = new Date(t);
  upd.textContent = `${at.getMonth() + 1}.${String(at.getDate()).padStart(2, "0")} ${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")} 기준`;
  const todayIso = d.time[0];
  const rows = d.time.map((iso, i) => {
    const tag = dayLabelFor(iso);
    return `<li class="${tag ? "trip" : ""}">
      <span class="d">${tag ? `<span class="tag">${tag}</span>` : ""}${fmtDate(iso)}</span>
      <span class="c">${WMO[d.weather_code[i]] || "—"}${d.precipitation_probability_max[i] != null ? ` · 비 ${d.precipitation_probability_max[i]}%` : ""}
        <small>일출 ${hm(d.sunrise[i])} · 일몰 ${hm(d.sunset[i])}</small></span>
      <span class="t">${Math.round(d.temperature_2m_max[i])}°<span>${Math.round(d.temperature_2m_min[i])}°</span></span>
    </li>`;
  }).join("");
  box.innerHTML = `
    <div class="now">
      <div class="temp">${Math.round(c.temperature_2m)}°</div>
      <div class="cond">${WMO[c.weather_code] || "—"}<small>체감 ${Math.round(c.apparent_temperature)}° · 습도 ${c.relative_humidity_2m}% · 바람 ${Math.round(c.wind_speed_10m)} km/h</small></div>
    </div>
    <p class="sun"><span>오늘 일출<b>${hm(d.sunrise[0])}</b></span><span>일몰<b>${hm(d.sunset[0])}</b></span></p>
    <ul class="days-wx">${rows}</ul>`;
}
async function refreshWx() {
  const btn = $("#wx-refresh"); btn.classList.add("busy"); btn.textContent = "불러오는 중";
  try {
    const r = await fetch(WX_URL); if (!r.ok) throw 0;
    const data = await r.json(); const saved = { t: Date.now(), data };
    try { localStorage.setItem(WX_KEY, JSON.stringify(saved)); } catch (e) {}
    renderWx(saved);
  } catch (e) {
    $("#wx-updated").textContent = "불러오지 못했어요 · 연결을 확인하고 다시 눌러주세요";
  }
  btn.classList.remove("busy"); btn.textContent = "새로고침";
}
$("#wx-refresh").addEventListener("click", refreshWx);
let wxShown = false;
function showWeather() {
  const saved = loadWx(); renderWx(saved);
  if (!saved && !wxShown) refreshWx();     // 저장된 게 없을 때만 자동으로 한 번
  wxShown = true;
}

/* 노선도 이미지 뷰어 — 핀치 확대 / 드래그 / 더블탭 */
(function () {
  const box = $("#mtrview"), img = $("#mtrimg");
  let sc = 1, tx = 0, ty = 0, minSc = 1, nat = { w: 0, h: 0 };
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  const clamp = () => {
    const W = box.clientWidth, H = box.clientHeight, w = nat.w * sc, h = nat.h * sc;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  };
  const fit = () => { if (!nat.w) return; minSc = Math.min(box.clientWidth / nat.w, box.clientHeight / nat.h); sc = minSc; clamp(); apply(); };
  const zoomAt = (f, cx, cy) => {
    const ns = Math.min(Math.max(sc * f, minSc), minSc * 8);
    tx = cx - (cx - tx) * (ns / sc); ty = cy - (cy - ty) * (ns / sc); sc = ns; clamp(); apply();
  };
  img.addEventListener("load", () => { nat = { w: img.naturalWidth, h: img.naturalHeight }; fit(); $("#mtrmsg").hidden = true; box.hidden = false; });
  img.addEventListener("error", () => { box.hidden = true; $("#mtrmsg").hidden = false; });
  img.src = "mtr-map.jpg";
  window.addEventListener("resize", fit);

  const ptrs = new Map(); let lastDist = 0, lastTap = 0;
  box.addEventListener("pointerdown", e => { if (e.target.closest(".viewer-ctl")) return; box.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
  box.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId); const cur = { x: e.clientX, y: e.clientY };
    if (ptrs.size === 1) { tx += cur.x - prev.x; ty += cur.y - prev.y; clamp(); apply(); }
    ptrs.set(e.pointerId, cur);
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()]; const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const r = box.getBoundingClientRect(), cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
      if (lastDist) zoomAt(dist / lastDist, cx, cy);
      lastDist = dist;
    }
  });
  const up = e => {
    if (ptrs.size === 1 && e.type === "pointerup") {
      const now = Date.now(); if (now - lastTap < 300) { const r = box.getBoundingClientRect(); zoomAt(sc > minSc * 1.5 ? minSc / sc : 2.5, e.clientX - r.left, e.clientY - r.top); } lastTap = now;
    }
    ptrs.delete(e.pointerId); if (ptrs.size < 2) lastDist = 0;
  };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("wheel", e => { e.preventDefault(); const r = box.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  box.querySelector(".viewer-ctl").addEventListener("click", e => {
    const b = e.target.closest("[data-z]"); if (!b) return;
    const cx = box.clientWidth / 2, cy = box.clientHeight / 2;
    if (b.dataset.z === "0") fit(); else zoomAt(b.dataset.z === "+" ? 1.4 : 1 / 1.4, cx, cy);
  });
})();

/* 하단 메뉴 (해시 라우팅: day1~day4 / weather / info) */
let currentView = "schedule";
let barMode = "days";   // "main" = 일정·준비물·정보, "days" = ← Day 1~4

function renderTabbar() {
  const ul = $("#tabbar");
  if (barMode === "days" && currentView === "schedule") {
    ul.className = "days";
    if (!$("#tabnav .back")) {
      const b = document.createElement("button"); b.type = "button"; b.className = "back"; b.setAttribute("aria-label", "메뉴로");
      b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
      $("#tabnav").prepend(b);
    }
    ul.innerHTML = TRIP.days.map((x, j) => `<li><button type="button" data-day="${j}" ${j === currentDay ? 'aria-current="page"' : ""}>${esc(x.label)}<span class="dot"></span></button></li>`).join("");
  } else {
    ul.className = "";
    $("#tabnav .back")?.remove();
    ul.innerHTML = [["schedule", "일정"], ["weather", "날씨"], ["info", "노선도"]].map(([v, t]) =>
      `<li><button type="button" data-view="${v}" ${v === currentView ? 'aria-current="page"' : ""}>${t}<span class="dot"></span></button></li>`).join("");
  }
}

function show(h) {
  let view = "schedule";
  const m = /^day([1-4])$/.exec(h);
  if (h === "weather" || h === "info") view = h;
  currentView = view;
  if (view !== "schedule") barMode = "main";
  ["schedule", "weather", "info"].forEach(n => { $("#view-" + n).hidden = n !== view; });
  if (view === "schedule") renderDay(m ? Number(m[1]) - 1 : currentDay);   // renderDay가 메뉴도 그림
  else renderTabbar();
  if (view === "weather") showWeather();
  window.scrollTo({ top: 0 });
}
$("#tabnav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("back")) { barMode = "main"; renderTabbar(); return; }
  if (b.dataset.day != null) {
    const target = "day" + (Number(b.dataset.day) + 1);
    if (location.hash.slice(1) === target) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    location.hash = target; return;
  }
  const v = b.dataset.view;
  if (v === "schedule") {            // 일정을 누르면 오늘 Day로, 메뉴는 Day 모드로
    barMode = "days";
    const target = "day" + (todayIndex() + 1);
    if (location.hash.slice(1) === target) { show(target); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else location.hash = target;
    return;
  }
  barMode = "main";
  if (location.hash.slice(1) === v) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  location.hash = v;
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

const h0 = location.hash.slice(1);
if (!/^day[1-4]$/.test(h0) && h0 !== "weather" && h0 !== "info") history.replaceState(null, "", "#day" + (todayIndex() + 1));
show(location.hash.slice(1));
loadMaps();
</script>
</body>
</html>
