<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fcfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="홍콩">
<meta name="mobile-web-app-capable" content="yes">
<title>홍콩 3박 4일</title>
<style>
/* Layout: one scrolling column, no fixed header. Hierarchy by size, weight and whitespace only.
   The only fixed element is a translucent bottom tab bar. */
:root{
  --bg:#fcfbfa;
  --fg:#1c1917;
  --muted:#8b817b;
  --faint:#b9b0aa;
  --hair:#ebe5e1;
  --accent:#c2493e;
  --accent-soft:#f6e3e0;
  --bar:rgba(252,251,250,.78);
  --water:#edf1f3;
  --l-twl:#d9332b;
  --l-isl:#1f79c7;
  --l-ae:#1a9a95;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141212; --fg:#ece7e3; --muted:#8f8580; --faint:#5f5752; --hair:#272322;
    --accent:#e2786d; --accent-soft:#3a211e; --bar:rgba(20,18,18,.72); --water:#1b2024;
    --l-twl:#ef5a52; --l-isl:#4f9be0; --l-ae:#39b5af; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141212; --fg:#ece7e3; --muted:#8f8580; --faint:#5f5752; --hair:#272322;
  --accent:#e2786d; --accent-soft:#3a211e; --bar:rgba(20,18,18,.72); --water:#1b2024;
  --l-twl:#ef5a52; --l-isl:#4f9be0; --l-ae:#39b5af; color-scheme:dark;
}

html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
main{
  max-width:560px; margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px calc(104px + env(safe-area-inset-bottom,0px));
}
.view[hidden]{display:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,.item:focus-within{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}

/* type scale */
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.2}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px}
.small{font-size:13px;color:var(--muted)}
.empty{color:var(--faint);font-size:14px;margin:0}

header.page{margin-bottom:34px}
.chips{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:18px;font-size:14px;font-variant-numeric:tabular-nums}
.chips button{color:var(--accent);font-weight:500}

/* schedule — one day per page: switcher, map (1/3 screen), stops */
#view-schedule{margin-top:-10px}
.dayswitch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.dayswitch .days{display:flex;gap:18px;font-size:14px;font-variant-numeric:tabular-nums}
.dayswitch .days button{color:var(--muted);padding-block:6px;position:relative}
.dayswitch .days button[aria-current="page"]{color:var(--fg);font-weight:600}
.dayswitch .days button[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:1px}
.dayswitch .date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mapwrap{
  position:relative;height:33vh;height:33dvh;min-height:180px;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:var(--water);overflow:hidden;
}
.mapwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.mapwrap .open{
  position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:12px;
  font-size:12px;letter-spacing:.02em;color:var(--accent);background:var(--bg);
  padding:5px 10px;border-radius:999px;opacity:.95;
}
.mapwrap .open:hover{text-decoration:none}
.mapwrap .nomap{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:14px}
.daybody{padding-top:26px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.dayhead .date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.timeline{display:flex;flex-direction:column;gap:22px;margin:0;padding:0;list-style:none}
.stop .num{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--bg);font-size:11px;font-weight:700;line-height:18px;text-align:center;margin-right:8px;vertical-align:2px;font-variant-numeric:tabular-nums}
.stop.move .num{background:var(--faint)}
.stop{display:grid;grid-template-columns:52px 1fr;gap:0 14px;align-items:baseline}
.stop .time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stop .place{font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:0}
.stop .note{grid-column:2;color:var(--muted);font-size:14px;margin-top:2px;min-width:0}
.stop .note a{margin-left:6px}
.stop.move .place{font-weight:400;color:var(--muted)}

/* packing */
.cat{padding-block:26px;border-top:1px solid var(--hair)}
.cat:first-of-type{border-top:0;padding-top:0}
.items{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:14px;padding-block:9px;position:relative}
.item input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.item .mark{
  flex:none;width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--faint);transition:border-color .2s,background .2s;
}
.item .label{
  flex:1;min-width:0;font-size:16px;position:relative;transition:color .25s;
}
.item .label::after{
  content:"";position:absolute;left:0;top:calc(50% + 1px);height:1.5px;width:100%;
  background:var(--accent);transform:scaleX(0);transform-origin:left center;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.item input:checked ~ .mark{background:var(--accent);border-color:var(--accent)}
.item input:checked ~ .label{color:var(--muted)}
.item input:checked ~ .label::after{transform:scaleX(1)}
.item label{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer}
.progress{margin:0 0 6px}

/* info */
.sec{padding-block:30px;border-top:1px solid var(--hair)}
.sec:first-of-type{border-top:0;padding-top:0}
.map{width:100%;height:auto;display:block;overflow:visible}
.map text{font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:7px;background:var(--c)}
.legend .ferry::before{background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 6px)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:10px 14px;margin:0;font-size:15px}
.kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* bottom tab bar — the only fixed element */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--bar);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border-top:1px solid var(--hair);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:10px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
}
nav.tabs ul{display:flex;justify-content:space-around;max-width:400px;margin:0 auto;padding:0;list-style:none}
nav.tabs button{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:14px;color:var(--muted);padding:4px 16px;letter-spacing:.01em;
}
nav.tabs button .dot{width:4px;height:4px;border-radius:50%;background:transparent;transition:background .2s}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
nav.tabs button[aria-current="page"] .dot{background:var(--accent)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<main>
  <!-- 일정 -->
  <section class="view" id="view-schedule">
    <div class="dayswitch">
      <div class="days" id="day-switch"></div>
      <span class="date" id="day-date"></span>
    </div>
    <div class="mapwrap" id="map"></div>
    <div class="daybody" id="daybody"></div>
  </section>

  <!-- 준비물 -->
  <section class="view" id="view-packing" hidden>
    <header class="page">
      <p class="eyebrow">Packing</p>
      <h1>준비물</h1>
      <p class="sub progress" id="packing-progress"></p>
    </header>
    <div id="packing"></div>
  </section>

  <!-- 정보 -->
  <section class="view" id="view-info" hidden>
    <header class="page">
      <p class="eyebrow">Info</p>
      <h1>정보</h1>
      <p class="sub">여행 중 한 번씩 꺼내 볼 것들</p>
    </header>

    <section class="sec">
      <h3>노선도</h3>
      <svg class="map" viewBox="0 0 360 300" role="img" aria-label="홍콩 MTR 간략 노선도: 공항철도, 췬완선, 아일랜드선, 스타페리">
        <!-- harbour -->
        <rect x="0" y="176" width="360" height="30" rx="4" fill="var(--water)"/>
        <text x="352" y="195" text-anchor="end" font-size="9.5" fill="var(--faint)" letter-spacing=".08">빅토리아 하버</text>

        <!-- Airport Express (teal) -->
        <polyline points="28,58 82,58 120,96 120,224" fill="none" stroke="var(--l-ae)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Tsuen Wan Line (red): Mong Kok → TST → Admiralty → Central -->
        <polyline points="200,36 200,230 128,230" fill="none" stroke="var(--l-twl)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Island Line (blue) -->
        <line x1="50" y1="244" x2="330" y2="244" stroke="var(--l-isl)" stroke-width="4" stroke-linecap="round"/>
        <!-- Star Ferry (dashed) TST ↔ Central -->
        <path d="M190,166 C170,190 150,206 132,220" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round"/>

        <!-- AE stations -->
        <g fill="var(--bg)" stroke="var(--l-ae)" stroke-width="2.4">
          <circle cx="28" cy="58" r="4.5"/><circle cx="82" cy="58" r="4.5"/><circle cx="120" cy="150" r="4.5"/>
        </g>
        <!-- TWL stations (Kowloon side) -->
        <g fill="var(--bg)" stroke="var(--l-twl)" stroke-width="2.4">
          <circle cx="200" cy="50" r="4.5"/><circle cx="200" cy="88" r="4.5"/><circle cx="200" cy="126" r="4.5"/><circle cx="200" cy="162" r="4.5"/>
        </g>
        <!-- Island stations -->
        <g fill="var(--bg)" stroke="var(--l-isl)" stroke-width="2.4">
          <circle cx="60" cy="244" r="4.5"/><circle cx="262" cy="244" r="4.5"/><circle cx="322" cy="244" r="4.5"/>
        </g>
        <!-- Interchanges: Central (AE+TWL+ISL), Admiralty (TWL+ISL) -->
        <g fill="var(--bg)" stroke="var(--fg)" stroke-width="2.2">
          <rect x="114" y="222" width="12" height="29" rx="6"/>
          <rect x="194" y="222" width="12" height="29" rx="6"/>
        </g>

        <!-- labels -->
        <g font-size="10.5" fill="var(--fg)">
          <text x="28" y="44" text-anchor="middle">공항</text>
          <text x="82" y="44" text-anchor="middle">칭이</text>
          <text x="110" y="153" text-anchor="end">카우룽</text>
          <text x="190" y="53" text-anchor="end">몽콕</text>
          <text x="190" y="91" text-anchor="end">야우마테이</text>
          <text x="190" y="129" text-anchor="end">조던</text>
          <text x="190" y="165" text-anchor="end" font-weight="600">침사추이</text>
          <text x="60" y="266" text-anchor="middle">셩완</text>
          <text x="120" y="266" text-anchor="middle" font-weight="600">센트럴</text>
          <text x="200" y="266" text-anchor="middle">애드미럴티</text>
          <text x="262" y="266" text-anchor="middle">완차이</text>
          <text x="322" y="266" text-anchor="middle">코즈웨이베이</text>
        </g>
        <g font-size="8" fill="var(--muted)" letter-spacing=".04">
          <text x="120" y="282" text-anchor="middle">Central · Hong Kong</text>
          <text x="200" y="282" text-anchor="middle">Admiralty</text>
          <text x="210" y="165">Tsim Sha Tsui</text>
          <text x="148" y="212" text-anchor="middle" transform="rotate(-38 148 212)">스타페리</text>
        </g>
      </svg>
      <div class="legend">
        <span style="--c:var(--l-ae)">공항철도</span>
        <span style="--c:var(--l-twl)">췬완선</span>
        <span style="--c:var(--l-isl)">아일랜드선</span>
        <span class="ferry">스타페리</span>
      </div>
      <p class="small" style="margin-top:12px">전체 노선은 <a href="https://www.mtr.com.hk/" target="_blank" rel="noopener">MTR 공식 사이트</a>에서.</p>
    </section>

    <section class="sec" id="info-stay">
      <h3>숙소</h3>
      <p class="empty">숙소 정보를 아직 넣지 않았어요.</p>
    </section>

    <section class="sec" id="info-transport">
      <h3>교통</h3>
      <p class="empty">옥토퍼스·공항 이동 등을 여기에.</p>
    </section>

    <section class="sec" id="info-emergency">
      <h3>비상연락</h3>
      <p class="empty">긴급번호·영사관 연락처를 여기에.</p>
    </section>
  </section>
</main>

<nav class="tabs" aria-label="메뉴">
  <ul>
    <li><button type="button" data-view="schedule">일정<span class="dot"></span></button></li>
    <li><button type="button" data-view="packing">준비물<span class="dot"></span></button></li>
    <li><button type="button" data-view="info">정보<span class="dot"></span></button></li>
  </ul>
</nav>

<script>
/* ───────────── 내용 (여기만 고치면 됨) ───────────── */
const TRIP = {
  // 날짜가 되면 그날 Day 페이지가 먼저 뜸 (여행 전엔 Day 1, 후엔 Day 4)
  // 지도: Google Maps Embed API — 그날 lat/lng가 있는 장소들을 순서대로 이어 경로로 보여줌
  mapsKey: "AIzaSyCcL_bS9msj_EdP-x2xk6QX7mw8iCSnqvo",
  mapMode: "driving",        // 경로 그릴 때 기준: driving / walking / bicycling (Day 안에 mapMode를 두면 그 Day만 다르게)
  days: [
    { label: "Day 1", date: "2026-11-17", items: [
      { time: "14:20", place: "홍콩 국제공항 도착", type: "move", lat: 22.3080, lng: 113.9185 },
      { time: "15:30", place: "공항철도 → 카우룽역, 택시로 숙소", type: "move" },
      { time: "16:30", place: "숙소 체크인", note: "침사추이", lat: 22.2946, lng: 114.1717 },
      { time: "18:30", place: "저녁", note: "침사추이 근처", lat: 22.2988, lng: 114.1722 },
      { time: "20:00", place: "심포니 오브 라이츠", note: "침사추이 해변 산책로", lat: 22.2936, lng: 114.1735 },
    ]},
    { label: "Day 2", date: "2026-11-18", items: [
      { time: "09:30", place: "스타페리 → 센트럴", type: "move", lat: 22.2855, lng: 114.1613 },
      { time: "10:30", place: "미드레벨 에스컬레이터 · 소호", lat: 22.2834, lng: 114.1534 },
      { time: "12:30", place: "점심", note: "소호", lat: 22.2826, lng: 114.1520 },
      { time: "15:00", place: "피크트램 → 빅토리아 피크", lat: 22.2759, lng: 114.1455 },
      { time: "18:00", place: "피크 야경", lat: 22.2710, lng: 114.1500 },
    ]},
    { label: "Day 3", date: "2026-11-19", items: [
      { time: "10:00", place: "몽콕 · 레이디스 마켓", lat: 22.3181, lng: 114.1705 },
      { time: "12:30", place: "딤섬 점심", note: "야우마테이", lat: 22.3115, lng: 114.1705 },
      { time: "15:00", place: "템플 스트리트", lat: 22.3058, lng: 114.1703 },
      { time: "17:00", place: "M+ · 서구룡문화지구", lat: 22.3024, lng: 114.1583 },
      { time: "19:30", place: "저녁", note: "침사추이", lat: 22.2975, lng: 114.1720 },
    ]},
    { label: "Day 4", date: "2026-11-20", items: [
      { time: "10:00", place: "체크아웃 · 짐 맡기기", lat: 22.2946, lng: 114.1717 },
      { time: "11:00", place: "하버시티 · 1881 헤리티지", lat: 22.2953, lng: 114.1690 },
      { time: "14:00", place: "공항철도 → 공항", type: "move" },
      { time: "17:30", place: "출발", type: "move", lat: 22.3080, lng: 113.9185 },
    ]},
  ],
  // 항목 형식: { time, place, note, type:"move"(이동이면), lat, lng }  — lat/lng가 있는 항목만 지도에 올라감
};

const PACKING = [
  // 형식: { category:"서류", items:["여권", "항공권 캡처"] }
];
/* ────────────────────────────────────────────── */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const WD = ["일", "월", "화", "수", "목", "금", "토"];
function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d);
  return `${m}.${String(d).padStart(2, "0")} ${WD[dt.getDay()]}`;
}
function todayIndex() {
  const n = new Date(); const t = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  const ts = TRIP.days.map(d => { const [y, m, dd] = d.date.split("-").map(Number); return new Date(y, m - 1, dd).getTime(); });
  const i = ts.indexOf(t); if (i >= 0) return i;
  if (t < ts[0]) return 0; if (t > ts[ts.length - 1]) return ts.length - 1;
  return 0;
}
const gmapsPoint = s => `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
function gmapsRoute(stops) {
  const p = stops.filter(s => s.lat != null);
  if (p.length < 2) return p.length ? gmapsPoint(p[0]) : null;
  const o = p[0], d = p[p.length - 1], w = p.slice(1, -1).map(s => `${s.lat},${s.lng}`).join("|");
  return `https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}` +
    (w ? `&waypoints=${encodeURIComponent(w)}` : "") + `&travelmode=transit`;
}

/* 일정 */
let currentDay = todayIndex();

function drawMap(day) {
  const box = $("#map"); const pts = day.items.filter(s => s.lat != null);
  const key = encodeURIComponent(TRIP.mapsKey || "");
  const route = gmapsRoute(day.items);
  const open = route ? `<a class="open" href="${route}" target="_blank" rel="noopener">Google 지도에서 열기 ↗</a>` : "";
  if (!TRIP.mapsKey || !pts.length) {
    box.innerHTML = `<div class="nomap">${TRIP.mapsKey ? "지도에 표시할 장소가 없어요" : "지도 키를 넣으면 여기에 표시돼요"}</div>` + open;
    return;
  }
  const ll = s => `${s.lat},${s.lng}`;
  let src;
  if (pts.length === 1) {
    src = `https://www.google.com/maps/embed/v1/place?key=${key}&q=${ll(pts[0])}&zoom=15&language=ko&region=HK`;
  } else {
    const o = pts[0], d = pts[pts.length - 1], w = pts.slice(1, -1).map(ll).join("|");
    src = `https://www.google.com/maps/embed/v1/directions?key=${key}&origin=${ll(o)}&destination=${ll(d)}` +
      (w ? `&waypoints=${encodeURIComponent(w)}` : "") + `&mode=${day.mapMode || TRIP.mapMode || "driving"}&language=ko&region=HK`;
  }
  box.innerHTML = `<iframe src="${src}" title="${esc(day.label)} 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>` + open;
}

function renderDay(i) {
  currentDay = i; const d = TRIP.days[i];
  $("#day-switch").innerHTML = TRIP.days.map((x, j) =>
    `<button type="button" data-day="${j}" ${j === i ? 'aria-current="page"' : ""}>${esc(x.label)}</button>`).join("");
  $("#day-date").textContent = fmtDate(d.date);
  $("#daybody").innerHTML = d.items.length ? `<ol class="timeline">${d.items.map((it, n) => `
    <li class="stop${it.type === "move" ? " move" : ""}">
      <span class="time">${esc(it.time || "")}</span>
      <span class="place"><span class="num">${n + 1}</span>${esc(it.place || "")}</span>
      ${(it.note || it.lat != null) ? `<span class="note">${esc(it.note || "")}${it.lat != null ? `<a href="${gmapsPoint(it)}" target="_blank" rel="noopener">지도</a>` : ""}</span>` : ""}
    </li>`).join("")}</ol>` : `<p class="empty">아직 비어 있어요.</p>`;
  drawMap(d);
}
$("#day-switch").addEventListener("click", e => {
  const b = e.target.closest("[data-day]"); if (!b) return;
  location.hash = "day" + (Number(b.dataset.day) + 1);
});

/* 준비물 */
const KEY = "hk-packing-v1";
let checked = {};
try { checked = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { checked = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch (e) {} }

function renderPacking() {
  const total = PACKING.reduce((n, c) => n + c.items.length, 0);
  const done = PACKING.reduce((n, c, ci) => n + c.items.filter((_, ii) => checked[ci + ":" + ii]).length, 0);
  $("#packing-progress").textContent = total ? `${done} / ${total}` : "";
  if (!total) { $("#packing").innerHTML = `<p class="empty">준비물을 아직 넣지 않았어요.</p>`; return; }
  $("#packing").innerHTML = PACKING.map((c, ci) => `
    <section class="cat">
      <h3>${esc(c.category)}</h3>
      <ul class="items">${c.items.map((it, ii) => {
        const id = ci + ":" + ii;
        return `<li class="item">
          <label><input type="checkbox" id="pk-${ci}-${ii}" data-id="${id}" ${checked[id] ? "checked" : ""}>
          <span class="mark"></span><span class="label">${esc(it)}</span></label>
        </li>`;
      }).join("")}</ul>
    </section>`).join("");
  $("#packing").addEventListener("change", e => {
    const cb = e.target; if (!cb.dataset.id) return;
    checked[cb.dataset.id] = cb.checked; save();
    const d = PACKING.reduce((n, c, ci) => n + c.items.filter((_, ii) => checked[ci + ":" + ii]).length, 0);
    $("#packing-progress").textContent = `${d} / ${total}`;
  });
}

/* 탭 (해시 라우팅: day1~day4 / packing / info) */
function show(h) {
  let view = "schedule";
  const m = /^day([1-4])$/.exec(h);
  if (h === "packing" || h === "info") view = h;
  ["schedule", "packing", "info"].forEach(n => { $("#view-" + n).hidden = n !== view; });
  document.querySelectorAll("nav.tabs button").forEach(b => {
    if (b.dataset.view === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (view === "schedule") renderDay(m ? Number(m[1]) - 1 : currentDay);
  window.scrollTo({ top: 0 });
}
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  const target = b.dataset.view === "schedule" ? "day" + (currentDay + 1) : b.dataset.view;
  if (location.hash.slice(1) === target) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  location.hash = target;
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

renderPacking();
show(location.hash.slice(1));
</script>
